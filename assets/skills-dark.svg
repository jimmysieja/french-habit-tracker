 x="86" y="197">Listening</text><rect class="h-track" x="96" y="184" width="404" height="18" rx="4"/><rect class="h-fill" x="96" y="184" width="307.6" height="18" rx="4"><title>Listening: practised on 76% of days</title></rect><text class="h-val" x="409.6" y="197">76%</text><line class="h-obj" x1="500.0" y1="181" x2="500.0" y2="205"><title>avg 147% of weekly objective</title></line></svg>