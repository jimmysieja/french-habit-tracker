.p-base{stroke:#383835;stroke-width:1}
.b-bar{fill:#3987e5}
.b-bar:hover{fill:#3987e5;opacity:.85}
.b-hi{fill:#3987e5}
.d-lab{fill:#898781;font-size:10px;text-anchor:middle}
.d-val{fill:#c3c2b7;font-size:10px;text-anchor:middle;font-weight:600}
/* heatmap */
.hm-mon{fill:#898781;font-size:10px}
.hm-dow{fill:#898781;font-size:9px;text-anchor:end}
rect:hover{opacity:.8}
/* horizontal bars */
.h-cat{fill:#fff;font-size:12px;text-anchor:end;dominant-baseline:middle}
.h-track{fill:#2c2c2a}
.h-fill{fill:#3987e5}
.h-val{fill:#c3c2b7;font-size:11px;font-weight:600;dominant-baseline:middle}
.h-obj{stroke:#fff;stroke-width:2}
.ts-lab{fill:#fff;font-size:11px;font-weight:600}
.ts-val{fill:#c3c2b7;font-size:11px}
