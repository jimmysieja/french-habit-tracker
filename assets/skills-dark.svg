<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 224" width="100%" role="img" aria-label="Share of days each skill was practised"><style>
.p-title{fill:#fff;font-size:12px;font-weight:600}
.p-sub{fill:#898781;font-size:10px}
.p-line{fill:none;stroke:#3987e5;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.p-area{fill:#3987e5;opacity:.10}
.p-end{fill:#3987e5;stroke:#1a1a19;stroke-width:2}
.p-endlab{fill:#c3c2b7;font-size:10px;text-anchor:end;font-weight:600}
.p-target{stroke:#898781;stroke-width:1;stroke-dasharray:0}
