<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 224" width="100%" role="img" aria-label="Share of days each skill was practiced"><style>
/* per-skill colour switch: set via a sk-* class on a wrapping element, read
   by the mark rules below (falls back to the neutral accent on aggregate
   charts that aren't scoped to one skill, e.g. the calendar or day-of-week) */
.sk-listening{--pc:#f4ee7b}
.sk-grammar{--pc:#8bd08b}
.sk-vocab{--pc:#82d0ed}
.sk-reading{--pc:#b498e1}
.sk-writing{--pc:#db99c3}
.sk-speaking{--pc:#de907c}
.p-title{fill:#e7e7e7;font-size:12px;font-weight:700}
.p-sub{fill:#9b9b9b;font-size:10px}
.p-unit{fill:#9b9b9b;font-size:10px}
.p-axis{fill:#9b9b9b;font-size:9.5px}
.p-grid{stroke:#2c2e34;stroke-width:1;stroke-dasharray:2,3}
.p-base{stroke:#2c2e34;stroke-width:1}
.p-tick{stroke:#2c2e34;stroke-width:1}
.p-xlab{fill:#9b9b9b;font-size:9px;text-anchor:middle}
.p-line{fill:none;stroke:var(--pc,#7ea9ec);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.p-area{fill:var(--pc,#7ea9ec);opacity:.12}
.p-end{fill:var(--pc,#7ea9ec);stroke:#15161a;stroke-width:2}
.p-endlab{fill:#c3c4c8;font-size:10px;text-anchor:end;font-weight:700}
.b-bar{fill:var(--pc,#7ea9ec)}
.b-bar:hover{fill:#a9c6f5;opacity:.9}
.d-lab{fill:#9b9b9b;font-size:10px;text-anchor:middle}
.d-val{fill:#c3c4c8;font-size:10px;text-anchor:middle;font-weight:700}
/* heatmap */
.hm-mon{fill:#9b9b9b;font-size:10px}
.hm-dow{fill:#9b9b9b;font-size:9px;text-anchor:end}
rect:hover{opacity:.82}
/* horizontal bars */
.h-cat{fill:#e7e7e7;font-size:12px;text-anchor:end;dominant-baseline:middle}
.h-track{fill:#2c2e34;opacity:.5}
.h-fill{fill:var(--pc,#7ea9ec)}
.h-val{fill:#c3c4c8;font-size:11px;font-weight:700;dominant-baseline:middle}
.ts-lab{fill:#e7e7e7;font-size:11px;font-weight:700}
.ts-val{fill:#9b9b9b;font-size:11px}
</style><rect x="0" y="0" width="100%" height="100%" fill="#15161a"/><text class="h-cat" x="86" y="27">Writing</text><rect class="h-track" x="96" y="14" width="404" height="18" rx="4"/><rect class="h-fill sk-writing" x="96" y="14" width="31.6" height="18" rx="4"><title>Writing: practiced on 8% of days</title></rect><text class="h-val" x="133.6" y="27">8%</text><text class="h-cat" x="86" y="61">Reading</text><rect class="h-track" x="96" y="48" width="404" height="18" rx="4"/><rect class="h-fill sk-reading" x="96" y="48" width="56.2" height="18" rx="4"><title>Reading: practiced on 14% of days</title></rect><text class="h-val" x="158.2" y="61">14%</text><text class="h-cat" x="86" y="95">Speaking</text><rect class="h-track" x="96" y="82" width="404" height="18" rx="4"/><rect class="h-fill sk-speaking" x="96" y="82" width="91.3" height="18" rx="4"><title>Speaking: practiced on 23% of days</title></rect><text class="h-val" x="193.3" y="95">23%</text><text class="h-cat" x="86" y="129">Vocab</text><rect class="h-track" x="96" y="116" width="404" height="18" rx="4"/><rect class="h-fill sk-vocab" x="96" y="116" width="231.9" height="18" rx="4"><title>Vocab: practiced on 57% of days</title></rect><text class="h-val" x="333.9" y="129">57%</text><text class="h-cat" x="86" y="163">Grammar</text><rect class="h-track" x="96" y="150" width="404" height="18" rx="4"/><rect class="h-fill sk-grammar" x="96" y="150" width="260.0" height="18" rx="4"><title>Grammar: practiced on 64% of days</title></rect><text class="h-val" x="362.0" y="163">64%</text><text class="h-cat" x="86" y="197">Listening</text><rect class="h-track" x="96" y="184" width="404" height="18" rx="4"/><rect class="h-fill sk-listening" x="96" y="184" width="323.2" height="18" rx="4"><title>Listening: practiced on 80% of days</title></rect><text class="h-val" x="425.2" y="197">80%</text></svg>