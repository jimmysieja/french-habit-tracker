<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 96" width="100%" role="img" aria-label="Share of estimated study time across all six skills, largest first"><style>
/* per-skill colour switch: set via a sk-* class on a wrapping element, read
   by the mark rules below (falls back to the neutral accent on aggregate
   charts that aren't scoped to one skill, e.g. the calendar or day-of-week) */
.sk-listening{--pc:#f4ee7b}
.sk-grammar{--pc:#8bd08b}
.sk-vocab{--pc:#82d0ed}
.sk-reading{--pc:#b498e1}
.sk-writing{--pc:#db99c3}
.sk-speaking{--pc:#de907c}
.p-title{fill:#e7e7e7;font-size:12px;font-weight:700}
.p-sub{fill:#9b9b9b;font-size:10px}
.p-unit{fill:#9b9b9b;font-size:10px}
.p-axis{fill:#9b9b9b;font-size:9.5px}
.p-grid{stroke:#2c2e34;stroke-width:1;stroke-dasharray:2,3}
.p-base{stroke:#2c2e34;stroke-width:1}
.p-tick{stroke:#2c2e34;stroke-width:1}
.p-xlab{fill:#9b9b9b;font-size:9px;text-anchor:middle}
.p-line{fill:none;stroke:var(--pc,#7ea9ec);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.p-area{fill:var(--pc,#7ea9ec);opacity:.12}
.p-end{fill:var(--pc,#7ea9ec);stroke:#15161a;stroke-width:2}
.p-endlab{fill:#c3c4c8;font-size:10px;text-anchor:end;font-weight:700}
.b-bar{fill:var(--pc,#7ea9ec)}
.b-bar:hover{fill:#a9c6f5;opacity:.9}
.d-lab{fill:#9b9b9b;font-size:10px;text-anchor:middle}
.d-val{fill:#c3c4c8;font-size:10px;text-anchor:middle;font-weight:700}
/* heatmap */
.hm-mon{fill:#9b9b9b;font-size:10px}
.hm-dow{fill:#9b9b9b;font-size:9px;text-anchor:end}
rect:hover{opacity:.82}
/* horizontal bars */
.h-cat{fill:#e7e7e7;font-size:12px;text-anchor:end;dominant-baseline:middle}
.h-track{fill:#2c2e34;opacity:.5}
.h-fill{fill:var(--pc,#7ea9ec)}
.h-val{fill:#c3c4c8;font-size:11px;font-weight:700;dominant-baseline:middle}
.ts-lab{fill:#e7e7e7;font-size:11px;font-weight:700}
.ts-val{fill:#9b9b9b;font-size:11px}
</style><rect x="0" y="0" width="100%" height="100%" fill="#15161a"/><rect x="0.0" y="0" width="297.2" height="24" rx="3" fill="#f4ee7b"><title>Listening: 61.8 h (54%)</title></rect><rect x="299.2" y="0" width="99.8" height="24" rx="3" fill="#8bd08b"><title>Grammar: 21.0 h (18%)</title></rect><rect x="401.0" y="0" width="49.3" height="24" rx="3" fill="#de907c"><title>Speaking: 10.6 h (9%)</title></rect><rect x="452.3" y="0" width="47.2" height="24" rx="3" fill="#82d0ed"><title>Vocab: 10.2 h (9%)</title></rect><rect x="501.5" y="0" width="28.3" height="24" rx="3" fill="#b498e1"><title>Reading: 6.2 h (5%)</title></rect><rect x="531.8" y="0" width="22.2" height="24" rx="3" fill="#db99c3"><title>Writing: 5.0 h (4%)</title></rect><rect x="0.0" y="40" width="10" height="10" rx="2" fill="#f4ee7b"/><text class="ts-lab" x="15.0" y="49">Listening</text><text class="ts-val" x="15.0" y="62">54% · 61.8 h</text><rect x="186.7" y="40" width="10" height="10" rx="2" fill="#8bd08b"/><text class="ts-lab" x="201.7" y="49">Grammar</text><text class="ts-val" x="201.7" y="62">18% · 21.0 h</text><rect x="373.3" y="40" width="10" height="10" rx="2" fill="#de907c"/><text class="ts-lab" x="388.3" y="49">Speaking</text><text class="ts-val" x="388.3" y="62">9% · 10.6 h</text><rect x="0.0" y="66" width="10" height="10" rx="2" fill="#82d0ed"/><text class="ts-lab" x="15.0" y="75">Vocab</text><text class="ts-val" x="15.0" y="88">9% · 10.2 h</text><rect x="186.7" y="66" width="10" height="10" rx="2" fill="#b498e1"/><text class="ts-lab" x="201.7" y="75">Reading</text><text class="ts-val" x="201.7" y="88">5% · 6.2 h</text><rect x="373.3" y="66" width="10" height="10" rx="2" fill="#db99c3"/><text class="ts-lab" x="388.3" y="75">Writing</text><text class="ts-val" x="388.3" y="88">4% · 5.0 h</text></svg>