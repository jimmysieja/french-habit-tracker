<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 176" width="100%" role="img" aria-label="Average minutes practised by day of week"><style>
.p-title{fill:#2c2c2c;font-size:12px;font-weight:600}
.p-sub{fill:#9b9b9b;font-size:10px}
.p-line{fill:none;stroke:#5a8fbf;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.p-area{fill:#5a8fbf;opacity:.10}
.p-end{fill:#5a8fbf;stroke:#ffffff;stroke-width:2}
.p-endlab{fill:#606060;font-size:10px;text-anchor:end;font-weight:600}
.p-target{stroke:#9b9b9b;stroke-width:1;stroke-dasharray:0}
.p-tlabel{fill:#9b9b9b;font-size:9px;text-anchor:end}
.p-base{stroke:#d1cdc6;stroke-width:1}
.b-bar{fill:#5a8fbf}
.b-bar:hover{fill:#5a8fbf;opacity:.85}
.b-hi{fill:#5a8fbf}
.d-lab{fill:#9b9b9b;font-size:10px;text-anchor:middle}
.d-val{fill:#606060;font-size:10px;text-anchor:middle;font-weight:600}
/* heatmap */
.hm-mon{fill:#9b9b9b;font-size:10px}
.hm-dow{fill:#9b9b9b;font-size:9px;text-anchor:end}
rect:hover{opacity:.8}
/* horizontal bars */
.h-cat{fill:#2c2c2c;font-size:12px;text-anchor:end;dominant-baseline:middle}
.h-track{fill:#eae7e1}
.h-fill{fill:#5a8fbf}
.h-val{fill:#606060;font-size:11px;font-weight:600;dominant-baseline:middle}
.h-obj{stroke:#2c2c2c;stroke-width:2}
.ts-lab{fill:#2c2c2c;font-size:11px;font-weight:600}
.ts-val{fill:#606060;font-size:11px}
</style><rect x="0" y="0" width="100%" height="100%" fill="#ffffff"/><line class="p-base" x1="8" y1="152" x2="552" y2="152"/><rect class="b-bar" x="31.9" y="103.8" width="30.0" height="48.2" rx="3"><title>Monday: 39 min/day avg</title></rect><text class="d-lab" x="46.9" y="167">Mon</text><text class="d-val" x="46.9" y="97.8">39</text><rect class="b-bar" x="109.6" y="47.0" width="30.0" height="105.0" rx="3"><title>Tuesday: 85 min/day avg</title></rect><text class="d-lab" x="124.6" y="167">Tue</text><text class="d-val" x="124.6" y="41.0">85</text><rect class="b-bar" x="187.3" y="81.0" width="30.0" height="71.0" rx="3"><title>Wednesday: 58 min/day avg</title></rect><text class="d-lab" x="202.3" y="167">Wed</text><text class="d-val" x="202.3" y="75.0">58</text><rect class="b-bar" x="265.0" y="92.9" width="30.0" height="59.1" rx="3"><title>Thursday: 48 min/day avg</title></rect><text class="d-lab" x="280.0" y="167">Thu</text><text class="d-val" x="280.0" y="86.9">48</text><rect class="b-bar" x="342.7" y="120.5" width="30.0" height="31.5" rx="3"><title>Friday: 26 min/day avg</title></rect><text class="d-lab" x="357.7" y="167">Fri</text><text class="d-val" x="357.7" y="114.5">26</text><rect class="b-bar" x="420.4" y="130.1" width="30.0" height="21.9" rx="3"><title>Saturday: 18 min/day avg</title></rect><text class="d-lab" x="435.4" y="167">Sat</text><text class="d-val" x="435.4" y="124.1">18</text><rect class="b-bar" x="498.1" y="112.6" width="30.0" height="39.4" rx="3"><title>Sunday: 32 min/day avg</title></rect><text class="d-lab" x="513.1" y="167">Sun</text><text class="d-val" x="513.1" y="106.6">32</text></svg>