<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 176" width="100%" role="img" aria-label="Average minutes practised by day of week"><style>
.p-title{fill:#0b0b0b;font-size:12px;font-weight:600}
.p-sub{fill:#898781;font-size:10px}
.p-line{fill:none;stroke:#2a78d6;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
