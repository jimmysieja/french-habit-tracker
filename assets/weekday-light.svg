<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 176" width="100%" role="img" aria-label="Average minutes practiced by day of week"><style>
.p-title{fill:#1a1a1a;font-size:12px;font-weight:700}
.p-sub{fill:#666666;font-size:10px}
.p-unit{fill:#666666;font-size:10px}
.p-axis{fill:#666666;font-size:9.5px}
.p-grid{stroke:#e3e3e3;stroke-width:1;stroke-dasharray:2,3}
.p-base{stroke:#e3e3e3;stroke-width:1}
.p-tick{stroke:#e3e3e3;stroke-width:1}
.p-xlab{fill:#666666;font-size:9px;text-anchor:middle}
.p-line{fill:none;stroke:#3a6fd0;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.p-area{fill:#3a6fd0;opacity:.12}
.p-end{fill:#3a6fd0;stroke:#ffffff;stroke-width:2}
.p-endlab{fill:#43454a;font-size:10px;text-anchor:end;font-weight:700}
.b-bar{fill:#3a6fd0}
.b-bar:hover{fill:#29508f;opacity:.9}
.d-lab{fill:#666666;font-size:10px;text-anchor:middle}
.d-val{fill:#43454a;font-size:10px;text-anchor:middle;font-weight:700}
/* heatmap */
.hm-mon{fill:#666666;font-size:10px}
.hm-dow{fill:#666666;font-size:9px;text-anchor:end}
rect:hover{opacity:.82}
/* horizontal bars */
.h-cat{fill:#1a1a1a;font-size:12px;text-anchor:end;dominant-baseline:middle}
.h-track{fill:#e3e3e3;opacity:.5}
.h-fill{fill:#3a6fd0}
.h-val{fill:#43454a;font-size:11px;font-weight:700;dominant-baseline:middle}
.ts-lab{fill:#1a1a1a;font-size:11px;font-weight:700}
.ts-val{fill:#666666;font-size:11px}
</style><rect x="0" y="0" width="100%" height="100%" fill="#ffffff"/><line class="p-base" x1="8" y1="152" x2="552" y2="152"/><rect class="b-bar" x="31.9" y="104.9" width="30.0" height="47.1" rx="3"><title>Monday: 36 min/day avg</title></rect><text class="d-lab" x="46.9" y="167">Mon</text><text class="d-val" x="46.9" y="98.9">36</text><rect class="b-bar" x="109.6" y="47.0" width="30.0" height="105.0" rx="3"><title>Tuesday: 81 min/day avg</title></rect><text class="d-lab" x="124.6" y="167">Tue</text><text class="d-val" x="124.6" y="41.0">81</text><rect class="b-bar" x="187.3" y="79.2" width="30.0" height="72.8" rx="3"><title>Wednesday: 56 min/day avg</title></rect><text class="d-lab" x="202.3" y="167">Wed</text><text class="d-val" x="202.3" y="73.2">56</text><rect class="b-bar" x="265.0" y="89.3" width="30.0" height="62.7" rx="3"><title>Thursday: 49 min/day avg</title></rect><text class="d-lab" x="280.0" y="167">Thu</text><text class="d-val" x="280.0" y="83.3">49</text><rect class="b-bar" x="342.7" y="118.3" width="30.0" height="33.7" rx="3"><title>Friday: 26 min/day avg</title></rect><text class="d-lab" x="357.7" y="167">Fri</text><text class="d-val" x="357.7" y="112.3">26</text><rect class="b-bar" x="420.4" y="127.4" width="30.0" height="24.6" rx="3"><title>Saturday: 19 min/day avg</title></rect><text class="d-lab" x="435.4" y="167">Sat</text><text class="d-val" x="435.4" y="121.4">19</text><rect class="b-bar" x="498.1" y="109.8" width="30.0" height="42.2" rx="3"><title>Sunday: 33 min/day avg</title></rect><text class="d-lab" x="513.1" y="167">Sun</text><text class="d-val" x="513.1" y="103.8">33</text></svg>