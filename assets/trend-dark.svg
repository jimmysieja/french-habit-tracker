<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 778 250" width="100%" role="img" aria-label="7-day rolling average per skill"><style>
/* per-skill colour switch: set via a sk-* class on a wrapping element, read
   by the mark rules below (falls back to the neutral accent on aggregate
   charts that aren't scoped to one skill, e.g. the calendar or day-of-week) */
.sk-listening{--pc:#f4ee7b}
.sk-grammar{--pc:#8bd08b}
.sk-vocab{--pc:#82d0ed}
.sk-reading{--pc:#b498e1}
.sk-writing{--pc:#db99c3}
.sk-speaking{--pc:#de907c}
.p-title{fill:#e7e7e7;font-size:12px;font-weight:700}
.p-sub{fill:#9b9b9b;font-size:10px}
.p-unit{fill:#9b9b9b;font-size:10px}
.p-axis{fill:#9b9b9b;font-size:9.5px}
.p-grid{stroke:#2c2e34;stroke-width:1;stroke-dasharray:2,3}
.p-base{stroke:#2c2e34;stroke-width:1}
.p-tick{stroke:#2c2e34;stroke-width:1}
.p-xlab{fill:#9b9b9b;font-size:9px;text-anchor:middle}
.p-line{fill:none;stroke:var(--pc,#7ea9ec);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.p-area{fill:var(--pc,#7ea9ec);opacity:.12}
.p-end{fill:var(--pc,#7ea9ec);stroke:#15161a;stroke-width:2}
.p-endlab{fill:#c3c4c8;font-size:10px;text-anchor:end;font-weight:700}
.b-bar{fill:var(--pc,#7ea9ec)}
.b-bar:hover{fill:#a9c6f5;opacity:.9}
.d-lab{fill:#9b9b9b;font-size:10px;text-anchor:middle}
.d-val{fill:#c3c4c8;font-size:10px;text-anchor:middle;font-weight:700}
/* heatmap */
.hm-mon{fill:#9b9b9b;font-size:10px}
.hm-dow{fill:#9b9b9b;font-size:9px;text-anchor:end}
rect:hover{opacity:.82}
/* horizontal bars */
.h-cat{fill:#e7e7e7;font-size:12px;text-anchor:end;dominant-baseline:middle}
.h-track{fill:#2c2e34;opacity:.5}
.h-fill{fill:var(--pc,#7ea9ec)}
.h-val{fill:#c3c4c8;font-size:11px;font-weight:700;dominant-baseline:middle}
.ts-lab{fill:#e7e7e7;font-size:11px;font-weight:700}
.ts-val{fill:#9b9b9b;font-size:11px}
</style><rect x="0" y="0" width="100%" height="100%" fill="#15161a"/><g class="sk-listening"><text class="p-title" x="6" y="13">Listening</text><text class="p-sub" x="6" y="25">min/day</text><polygon class="p-area" points="6,106.0 6.0,64.7 8.1,64.7 10.2,64.7 12.3,52.0 14.4,62.8 16.4,70.0 18.5,72.9 20.6,72.3 22.7,70.9 24.8,69.4 26.9,78.5 29.0,78.5 31.1,78.5 33.1,80.7 35.2,84.5 37.3,93.2 39.4,97.9 41.5,97.6 43.6,97.6 45.7,97.6 47.8,97.6 49.8,97.6 51.9,88.6 54.0,82.8 56.1,78.8 58.2,74.7 60.3,64.3 62.4,60.1 64.5,57.6 66.5,49.2 68.6,39.9 70.7,40.3 72.8,44.4 74.9,54.8 77.0,59.0 79.1,51.7 81.2,61.8 83.2,75.3 85.3,76.7 87.4,72.9 89.5,66.6 91.6,61.7 93.7,66.4 95.8,69.5 97.9,70.9 99.9,71.8 102.0,67.7 104.1,74.0 106.2,77.5 108.3,78.4 110.4,74.6 112.5,68.7 114.6,65.6 116.6,70.2 118.7,66.7 120.8,66.7 122.9,62.5 125.0,64.5 127.1,59.0 129.2,66.4 131.3,69.7 133.4,73.2 135.4,74.6 137.5,81.6 139.6,72.5 141.7,83.4 143.8,82.4 145.9,82.4 148.0,78.9 150.1,73.7 152.1,70.8 154.2,81.9 156.3,82.1 158.4,78.6 160.5,74.4 162.6,77.9 164.7,83.1 166.8,85.5 168.8,86.1 170.9,88.2 173.0,85.7 175.1,84.0 177.2,80.9 179.3,72.2 181.4,67.8 183.5,60.8 185.5,59.3 187.6,65.3 189.7,65.6 191.8,68.7 193.9,73.9 196.0,72.7 198.1,79.1 200.2,75.6 202.2,69.5 204.3,69.5 206.4,63.5 208.5,65.7 210.6,73.2 212.7,73.3 214.8,74.9 216.9,77.5 218.9,80.5 221.0,84.8 223.1,79.6 225.2,67.0 227.3,62.2 229.4,60.5 231.5,60.7 233.6,59.1 235.6,57.6 237.7,61.2 239.8,69.8 241.9,66.0 244.0,69.0 244.0,106.0"/><polyline class="p-line" points="6.0,64.7 8.1,64.7 10.2,64.7 12.3,52.0 14.4,62.8 16.4,70.0 18.5,72.9 20.6,72.3 22.7,70.9 24.8,69.4 26.9,78.5 29.0,78.5 31.1,78.5 33.1,80.7 35.2,84.5 37.3,93.2 39.4,97.9 41.5,97.6 43.6,97.6 45.7,97.6 47.8,97.6 49.8,97.6 51.9,88.6 54.0,82.8 56.1,78.8 58.2,74.7 60.3,64.3 62.4,60.1 64.5,57.6 66.5,49.2 68.6,39.9 70.7,40.3 72.8,44.4 74.9,54.8 77.0,59.0 79.1,51.7 81.2,61.8 83.2,75.3 85.3,76.7 87.4,72.9 89.5,66.6 91.6,61.7 93.7,66.4 95.8,69.5 97.9,70.9 99.9,71.8 102.0,67.7 104.1,74.0 106.2,77.5 108.3,78.4 110