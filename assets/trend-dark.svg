<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 778 250" width="100%" role="img" aria-label="7-day rolling average per skill"><style>
/* per-skill colour switch: set via a sk-* class on a wrapping element, read
   by the mark rules below (falls back to the neutral accent on aggregate
   charts that aren't scoped to one skill, e.g. the calendar or day-of-week) */
.sk-listening{--pc:#f4ee7b}
.sk-grammar{--pc:#8bd08b}
.sk-vocab{--pc:#82d0ed}
.sk-reading{--pc:#b498e1}
.sk-writing{--pc:#db99c3}
.sk-speaking{--pc:#de907c}
.p-title{fill:#e7e7e7;font-size:12px;font-weight:700}
.p-sub{fill:#9b9b9b;font-size:10px}
.p-unit{fill:#9b9b9b;font-size:10px}
.p-axis{fill:#9b9b9b;font-size:9.5px}
.p-grid{stroke:#2c2e34;stroke-width:1;stroke-dasharray:2,3}
.p-base{stroke:#2c2e34;stroke-width:1}
.p-tick{stroke:#2c2e34;stroke-width:1}
.p-xlab{fill:#9b9b9b;font-size:9px;text-anchor:middle}
.p-line{fill:none;stroke:var(--pc,#7ea9ec);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.p-area{fill:var(--pc,#7ea9ec);opacity:.12}
.p-end{fill:var(--pc,#7ea9ec);stroke:#15161a;stroke-width:2}
.p-endlab{fill:#c3c4c8;font-size:10px;text-anchor:end;font-weight:700}
.b-bar{fill:var(--pc,#7ea9ec)}
.b-bar:hover{fill:#a9c6f5;opacity:.9}
.d-lab{fill:#9b9b9b;font-size:10px;text-anchor:middle}
.d-val{fill:#c3c4c8;font-size:10px;text-anchor:middle;font-weight:700}
/* heatmap */
.hm-mon{fill:#9b9b9b;font-size:10px}
.hm-dow{fill:#9b9b9b;font-size:9px;text-anchor:end}
rect:hover{opacity:.82}
/* horizontal bars */
.h-cat{fill:#e7e7e7;font-size:12px;text-anchor:end;dominant-baseline:middle}
.h-track{fill:#2c2e34;opacity:.5}
.h-fill{fill:var(--pc,#7ea9ec)}
.h-val{fill:#c3c4c8;font-size:11px;font-weight:700;dominant-baseline:middle}
.ts-lab{fill:#e7e7e7;font-size:11px;font-weight:700}
.ts-val{fill:#9b9b9b;font-size:11px}
</style><rect x="0" y="0" width="100%" height="100%" fill="#15161a"/><g class="sk-listening"><text class="p-title" x="6" y="13">Listening</text><text class="p-sub" x="6" y="25">min/day</text><polygon class="p-area" points="6,106.0 6.0,64.7 8.2,64.7 10.4,64.7 12.6,52.0 14.8,62.8 17.0,70.0 19.2,72.9 21.4,72.3 23.6,70.9 25.8,69.4 28.0,78.5 30.2,78.5 32.4,78.5 34.6,80.7 36.9,84.5 39.1,93.2 41.3,97.9 43.5,97.6 45.7,97.6 47.9,97.6 50.1,97.6 52.3,97.6 54.5,88.6 56.7,82.8 58.9,78.8 61.1,74.7 63.3,64.3 65.5,60.1 67.7,57.6 69.9,49.2 72.1,39.9 74.3,40.3 76.5,44.4 78.7,54.8 80.9,59.0 83.1,51.7 85.3,61.8 87.5,75.3 89.7,76.7 91.9,72.9 94.1,66.6 96.4,61.7 98.6,66.4 100.8,69.5 103.0,70.9 105.2,71.8 107.4,67.7 109.6,74.0 111.8,77.5 114.0,78.4 116.2,74.6 118.4,68.7 120.6,65.6 122.8,70.2 125.0,66.7 127.2,66.7 129.4,62.5 131.6,64.5 133.8,59.0 136.0,66.4 138.2,69.7 140.4,73.2 142.6,74.6 144.8,81.6 147.0,72.5 149.2,83.4 151.4,82.4 153.6,82.4 155.9,78.9 158.1,73.7 160.3,70.8 162.5,81.9 164.7,82.1 166.9,78.6 169.1,74.4 171.3,77.9 173.5,83.1 175.7,85.5 177.9,86.1 180.1,88.2 182.3,85.7 184.5,84.0 186.7,80.9 188.9,72.2 191.1,67.8 193.3,60.8 195.5,59.3 197.7,65.3 199.9,65.6 202.1,68.7 204.3,73.9 206.5,72.7 208.7,79.1 210.9,75.6 213.1,69.5 215.4,69.5 217.6,63.5 219.8,65.7 222.0,73.2 224.2,73.3 226.4,74.9 228.6,77.5 230.8,80.5 233.0,84.8 235.2,79.6 237.4,67.0 239.6,62.2 241.8,60.5 244.0,60.7 244.0,106.0"/><polyline class="p-line" points="6.0,64.7 8.2,64.7 10.4,64.7 12.6,52.0 14.8,62.8 17.0,70.0 19.2,72.9 21.4,72.3 23.6,70.9 25.8,69.4 28.0,78.5 30.2,78.5 32.4,78.5 34.6,80.7 36.9,84.5 39.1,93.2 41.3,97.9 43.5,97.6 45.7,97.6 47.9,97.6 50.1,97.6 52.3,97.6 54.5,88.6 56.7,82.8 58.9,78.8 61.1,74.7 63.3,64.3 65.5,60.1 67.7,57.6 69.9,49.2 72.1,39.9 74.3,40.3 76.5,44.4 78.7,54.8 80.9,59.0 83.1,51.7 85.3,61.8 87.5,75.3 89.7,76.7 91.9,72.9 94.1,66.6 96.4,61.7 98.6,66.4 100.8,69.5 103.0,70.9 105.2,71.8 107.4,67.7 109.6,74.0 111.8,77.5 114.0,78.4 116.2,74.6 118.4,68.7 120.6,65.6 122.8,70.2 125.0,66.7 127.2,66