<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 778 250" width="100%" role="img" aria-label="7-day rolling average per skill"><style>
/* per-skill colour switch: set via a sk-* class on a wrapping element, read
   by the mark rules below (falls back to the neutral accent on aggregate
   charts that aren't scoped to one skill, e.g. the calendar or day-of-week) */
.sk-listening{--pc:#f4ee7b}
.sk-grammar{--pc:#8bd08b}
.sk-vocab{--pc:#82d0ed}
.sk-reading{--pc:#b498e1}
.sk-writing{--pc:#db99c3}
.sk-speaking{--pc:#de907c}
.p-title{fill:#e7e7e7;font-size:12px;font-weight:700}
.p-sub{fill:#9b9b9b;font-size:10px}
.p-unit{fill:#9b9b9b;font-size:10px}
.p-axis{fill:#9b9b9b;font-size:9.5px}
.p-grid{stroke:#2c2e34;stroke-width:1;stroke-dasharray:2,3}
.p-base{stroke:#2c2e34;stroke-width:1}
.p-tick{stroke:#2c2e34;stroke-width:1}
.p-xlab{fill:#9b9b9b;font-size:9px;text-anchor:middle}
.p-line{fill:none;stroke:var(--pc,#7ea9ec);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.p-area{fill:var(--pc,#7ea9ec);opacity:.12}
.p-end{fill:var(--pc,#7ea9ec);stroke:#15161a;stroke-width:2}
.p-endlab{fill:#c3c4c8;font-size:10px;text-anchor:end;font-weight:700}
.b-bar{fill:var(--pc,#7ea9ec)}
.b-bar:hover{fill:#a9c6f5;opacity:.9}
.d-lab{fill:#9b9b9b;font-size:10px;text-anchor:middle}
.d-val{fill:#c3c4c8;font-size:10px;text-anchor:middle;font-weight:700}
/* heatmap */
.hm-mon{fill:#9b9b9b;font-size:10px}
.hm-dow{fill:#9b9b9b;font-size:9px;text-anchor:end}
rect:hover{opacity:.82}
/* horizontal bars */
.h-cat{fill:#e7e7e7;font-size:12px;text-anchor:end;dominant-baseline:middle}
.h-track{fill:#2c2e34;opacity:.5}
.h-fill{fill:var(--pc,#7ea9ec)}
.h-val{fill:#c3c4c8;font-size:11px;font-weight:700;dominant-baseline:middle}
.ts-lab{fill:#e7e7e7;font-size:11px;font-weight:700}
.ts-val{fill:#9b9b9b;font-size:11px}
</style><rect x="0" y="0" width="100%" height="100%" fill="#15161a"/><g class="sk-listening"><text class="p-title" x="6" y="13">Listening</text><text class="p-sub" x="6" y="25">min/day</text><polygon class="p-area" points="6,106.0 6.0,64.7 8.1,64.7 10.1,64.7 12.2,52.0 14.2,62.8 16.3,70.0 18.3,72.9 20.4,72.3 22.4,70.9 24.5,69.4 26.5,78.5 28.6,78.5 30.6,78.5 32.7,80.7 34.7,84.5 36.8,93.2 38.8,97.9 40.9,97.6 42.9,97.6 45.0,97.6 47.0,97.6 49.1,97.6 51.1,88.6 53.2,82.8 55.2,78.8 57.3,74.7 59.3,64.3 61.4,60.1 63.4,57.6 65.5,49.2 67.6,39.9 69.6,40.3 71.7,44.4 73.7,54.8 75.8,59.0 77.8,51.7 79.9,61.8 81.9,75.3 84.0,76.7 86.0,72.9 88.1,66.6 90.1,61.7 92.2,66.4 94.2,69.5 96.3,70.9 98.3,71.8 100.4,67.7 102.4,74.0 104.5,77.5 106.5,78.4 108.6,74.6 110.6,68.7 112.7,65.6 114.7,70.2 116.8,66.7 118.8,66.7 120.9,62.5 122.9,64.5 125.0,59.0 127.1,66.4 129.1,69.7 131.2,73.2 133.2,74.6 135.3,81.6 137.3,72.5 139.4,83.4 141.4,82.4 143.5,82.4 145.5,78.9 147.6,73.7 149.6,70.8 151.7,81.9 153.7,82.1 155.8,78.6 157.8,74.4 159.9,77.9 161.9,83.1 164.0,85.5 166.0,86.1 168.1,88.2 170.1,85.7 172.2,84.0 174.2,80.9 176.3,72.2 178.3,67.8 180.4,60.8 182.4,59.3 184.5,65.3 186.6,65.6 188.6,68.7 190.7,73.9 192.7,72.7 194.8,79.1 196.8,75.6 198.9,69.5 200.9,69.5 203.0,63.5 205.0,65.7 207.1,73.2 209.1,73.3 211.2,74.9 213.2,77.5 215.3,80.5 217.3,84.8 219.4,79.6 221.4,67.0 223.5,62.2 225.5,60.5 227.6,60.7 229.6,59.1 231.7,57.6 233.7,61.2 235.8,69.8 237.8,72.9 239.9,75.8 241.9,72.6 244.0,69.4 244.0,106.0"/><polyline class="p-line" points="6.0,64.7 8.1,64.7 10.1,64.7 12.2,52.0 14.2,62.8 16.3,70.0 18.3,72.9 20.4,72.3 22.4,70.9 24.5,69.4 26.5,78.5 28.6,78.5 30.6,78.5 32.7,80.7 34.7,84.5 36.8,93.2 38.8,97.9 40.9,97.6 42.9,97.6 45.0,97.6 47.0,97.6 49.1,97.6 51.1,88.6 53.2,82.8 55.2,78.8 57.3,74.7 59.3,64.3 61.4,60.1 63.4,57.6 65.5,49.2 67.6,39.9 69.6,40.3 71.7,44.4 73.7,54.8 75.8,59.0 77.8,51.7 79.9,61.8 81.9,75.3 84.0,76.7 86.0,72.9 88.1,66.6 90.1,61.7 92.2,66.4 94.2,69.5 96.3,70.9 98.3,71.8 100.4,67.7 102.4,74.0 104