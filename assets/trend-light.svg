<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 778 250" width="100%" role="img" aria-label="7-day rolling average per skill"><style>
/* per-skill colour switch: set via a sk-* class on a wrapping element, read
   by the mark rules below (falls back to the neutral accent on aggregate
   charts that aren't scoped to one skill, e.g. the calendar or day-of-week) */
.sk-listening{--pc:#ccc319}
.sk-grammar{--pc:#358d35}
.sk-vocab{--pc:#1fa4d6}
.sk-reading{--pc:#7a49ca}
.sk-writing{--pc:#cd519f}
.sk-speaking{--pc:#d05739}
.p-title{fill:#1a1a1a;font-size:12px;font-weight:700}
.p-sub{fill:#666666;font-size:10px}
.p-unit{fill:#666666;font-size:10px}
.p-axis{fill:#666666;font-size:9.5px}
.p-grid{stroke:#e3e3e3;stroke-width:1;stroke-dasharray:2,3}
.p-base{stroke:#e3e3e3;stroke-width:1}
.p-tick{stroke:#e3e3e3;stroke-width:1}
.p-xlab{fill:#666666;font-size:9px;text-anchor:middle}
.p-line{fill:none;stroke:var(--pc,#3a6fd0);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.p-area{fill:var(--pc,#3a6fd0);opacity:.12}
.p-end{fill:var(--pc,#3a6fd0);stroke:#ffffff;stroke-width:2}
.p-endlab{fill:#43454a;font-size:10px;text-anchor:end;font-weight:700}
.b-bar{fill:var(--pc,#3a6fd0)}
.b-bar:hover{fill:#29508f;opacity:.9}
.d-lab{fill:#666666;font-size:10px;text-anchor:middle}
.d-val{fill:#43454a;font-size:10px;text-anchor:middle;font-weight:700}
/* heatmap */
.hm-mon{fill:#666666;font-size:10px}
.hm-dow{fill:#666666;font-size:9px;text-anchor:end}
rect:hover{opacity:.82}
/* horizontal bars */
.h-cat{fill:#1a1a1a;font-size:12px;text-anchor:end;dominant-baseline:middle}
.h-track{fill:#e3e3e3;opacity:.5}
.h-fill{fill:var(--pc,#3a6fd0)}
.h-val{fill:#43454a;font-size:11px;font-weight:700;dominant-baseline:middle}
.ts-lab{fill:#1a1a1a;font-size:11px;font-weight:700}
.ts-val{fill:#666666;font-size:11px}
</style><rect x="0" y="0" width="100%" height="100%" fill="#ffffff"/><g class="sk-listening"><text class="p-title" x="6" y="13">Listening</text><text class="p-sub" x="6" y="25">min/day</text><polygon class="p-area" points="6,106.0 6.0,64.7 8.1,64.7 10.1,64.7 12.2,52.0 14.3,62.8 16.3,70.0 18.4,72.9 20.5,72.3 22.6,70.9 24.6,69.4 26.7,78.5 28.8,78.5 30.8,78.5 32.9,80.7 35.0,84.5 37.0,93.2 39.1,97.9 41.2,97.6 43.3,97.6 45.3,97.6 47.4,97.6 49.5,97.6 51.5,88.6 53.6,82.8 55.7,78.8 57.7,74.7 59.8,64.3 61.9,60.1 63.9,57.6 66.0,49.2 68.1,39.9 70.2,40.3 72.2,44.4 74.3,54.8 76.4,59.0 78.4,51.7 80.5,61.8 82.6,75.3 84.6,76.7 86.7,72.9 88.8,66.6 90.9,61.7 92.9,66.4 95.0,69.5 97.1,70.9 99.1,71.8 101.2,67.7 103.3,74.0 105.3,77.5 107.4,78.4 109.5,74.6 111.5,68.7 113.6,65.6 115.7,70.2 117.8,66.7 119.8,66.7 121.9,62.5 124.0,64.5 126.0,59.0 128.1,66.4 130.2,69.7 132.2,73.2 134.3,74.6 136.4,81.6 138.5,72.5 140.5,83.4 142.6,82.4 144.7,82.4 146.7,78.9 148.8,73.7 150.9,70.8 152.9,81.9 155.0,82.1 157.1,78.6 159.1,74.4 161.2,77.9 163.3,83.1 165.4,85.5 167.4,86.1 169.5,88.2 171.6,85.7 173.6,84.0 175.7,80.9 177.8,72.2 179.8,67.8 181.9,60.8 184.0,59.3 186.1,65.3 188.1,65.6 190.2,68.7 192.3,73.9 194.3,72.7 196.4,79.1 198.5,75.6 200.5,69.5 202.6,69.5 204.7,63.5 206.7,65.7 208.8,73.2 210.9,73.3 213.0,74.9 215.0,77.5 217.1,80.5 219.2,84.8 221.2,79.6 223.3,67.0 225.4,62.2 227.4,60.5 229.5,60.7 231.6,59.1 233.7,57.6 235.7,61.2 237.8,69.8 239.9,72.9 241.9,75.8 244.0,72.6 244.0,106.0"/><polyline class="p-line" points="6.0,64.7 8.1,64.7 10.1,64.7 12.2,52.0 14.3,62.8 16.3,70.0 18.4,72.9 20.5,72.3 22.6,70.9 24.6,69.4 26.7,78.5 28.8,78.5 30.8,78.5 32.9,80.7 35.0,84.5 37.0,93.2 39.1,97.9 41.2,97.6 43.3,97.6 45.3,97.6 47.4,97.6 49.5,97.6 51.5,88.6 53.6,82.8 55.7,78.8 57.7,74.7 59.8,64.3 61.9,60.1 63.9,57.6 66.0,49.2 68.1,39.9 70.2,40.3 72.2,44.4 74.3,54.8 76.4,59.0 78.4,51.7 80.5,61.8 82.6,75.3 84.6,76.7 86.7,72.9 88.8,66.6 90.9,61.7 92.9,66.4 95.0,69.5 97.1,70.9 99.1,71.8 101.2,67.7 103.3,74.0 105.3,77.5 107