.h-cat{fill:#2c2c2c;font-size:12px;text-anchor:end;dominant-baseline:middle}
.h-track{fill:#eae7e1}
.h-fill{fill:#5a8fbf}
.h-val{fill:#606060;font-size:11px;font-weight:600;dominant-baseline:middle}
.h-obj{stroke:#2c2c2c;stroke-width:2}
.ts-lab{fill:#2c2c2c;font-size:11px;font-weight:600}
.ts-val{fill:#606060;font-size:11px}
