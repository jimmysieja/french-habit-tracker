<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 778 250" width="100%" role="img" aria-label="Weekly totals per skill"><style>
/* per-skill colour switch: set via a sk-* class on a wrapping element, read
   by the mark rules below (falls back to the neutral accent on aggregate
   charts that aren't scoped to one skill, e.g. the calendar or day-of-week) */
.sk-listening{--pc:#ccc319}
.sk-grammar{--pc:#358d35}
.sk-vocab{--pc:#1fa4d6}
.sk-reading{--pc:#7a49ca}
.sk-writing{--pc:#cd519f}
.sk-speaking{--pc:#d05739}
.p-title{fill:#1a1a1a;font-size:12px;font-weight:700}
.p-sub{fill:#666666;font-size:10px}
.p-unit{fill:#666666;font-size:10px}
.p-axis{fill:#666666;font-size:9.5px}
.p-grid{stroke:#e3e3e3;stroke-width:1;stroke-dasharray:2,3}
.p-base{stroke:#e3e3e3;stroke-width:1}
.p-tick{stroke:#e3e3e3;stroke-width:1}
.p-xlab{fill:#666666;font-size:9px;text-anchor:middle}
.p-line{fill:none;stroke:var(--pc,#3a6fd0);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.p-area{fill:var(--pc,#3a6fd0);opacity:.12}
.p-end{fill:var(--pc,#3a6fd0);stroke:#ffffff;stroke-width:2}
.p-endlab{fill:#43454a;font-size:10px;text-anchor:end;font-weight:700}
.b-bar{fill:var(--pc,#3a6fd0)}
.b-bar:hover{fill:#29508f;opacity:.9}
.d-lab{fill:#666666;font-size:10px;text-anchor:middle}
.d-val{fill:#43454a;font-size:10px;text-anchor:middle;font-weight:700}
/* heatmap */
.hm-mon{fill:#666666;font-size:10px}
.hm-dow{fill:#666666;font-size:9px;text-anchor:end}
rect:hover{opacity:.82}
/* horizontal bars */
.h-cat{fill:#1a1a1a;font-size:12px;text-anchor:end;dominant-baseline:middle}
.h-track{fill:#e3e3e3;opacity:.5}
.h-fill{fill:var(--pc,#3a6fd0)}
.h-val{fill:#43454a;font-size:11px;font-weight:700;dominant-baseline:middle}
.ts-lab{fill:#1a1a1a;font-size:11px;font-weight:700}
.ts-val{fill:#666666;font-size:11px}
