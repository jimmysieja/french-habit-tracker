<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 176" width="100%" role="img" aria-label="Average minutes practiced by day of week"><style>
/* per-skill colour switch: set via a sk-* class on a wrapping element, read
   by the mark rules below (falls back to the neutral accent on aggregate
   charts that aren't scoped to one skill, e.g. the calendar or day-of-week) */
.sk-listening{--pc:#f4ee7b}
.sk-grammar{--pc:#8bd08b}
.sk-vocab{--pc:#82d0ed}
.sk-reading{--pc:#b498e1}
.sk-writing{--pc:#db99c3}
.sk-speaking{--pc:#de907c}
.p-title{fill:#e7e7e7;font-size:12px;font-weight:700}
.p-sub{fill:#9b9b9b;font-size:10px}
.p-unit{fill:#9b9b9b;font-size:10px}
.p-axis{fill:#9b9b9b;font-size:9.5px}
.p-grid{stroke:#2c2e34;stroke-width:1;stroke-dasharray:2,3}
.p-base{stroke:#2c2e34;stroke-width:1}
.p-tick{stroke:#2c2e34;stroke-width:1}
.p-xlab{fill:#9b9b9b;font-size:9px;text-anchor:middle}
.p-line{fill:none;stroke:var(--pc,#7ea9ec);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.p-area{fill:var(--pc,#7ea9ec);opacity:.12}
.p-end{fill:var(--pc,#7ea9ec);stroke:#15161a;stroke-width:2}
.p-endlab{fill:#c3c4c8;font-size:10px;text-anchor:end;font-weight:700}
.b-bar{fill:var(--pc,#7ea9ec)}
.b-bar:hover{fill:#a9c6f5;opacity:.9}
.d-lab{fill:#9b9b9b;font-size:10px;text-anchor:middle}
.d-val{fill:#c3c4c8;font-size:10px;text-anchor:middle;font-weight:700}
/* heatmap */
.hm-mon{fill:#9b9b9b;font-size:10px}
.hm-dow{fill:#9b9b9b;font-size:9px;text-anchor:end}
rect:hover{opacity:.82}
/* horizontal bars */
.h-cat{fill:#e7e7e7;font-size:12px;text-anchor:end;dominant-baseline:middle}
.h-track{fill:#2c2e34;opacity:.5}
.h-fill{fill:var(--pc,#7ea9ec)}
.h-val{fill:#c3c4c8;font-size:11px;font-weight:700;dominant-baseline:middle}
.ts-lab{fill:#e7e7e7;font-size:11px;font-weight:700}
.ts-val{fill:#9b9b9b;font-size:11px}
</style><rect x="0" y="0" width="100%" height="100%" fill="#15161a"/><line class="p-base" x1="8" y1="152" x2="552" y2="152"/><rect class="b-bar" x="31.9" y="101.1" width="30.0" height="50.9" rx="3"><title>Monday: 39 min/day avg</title></rect><text class="d-lab" x="46.9" y="167">Mon</text><text class="d-val" x="46.9" y="95.1">39</text><rect class="b-bar" x="109.6" y="47.0" width="30.0" height="105.0" rx="3"><title>Tuesday: 81 min/day avg</title></rect><text class="d-lab" x="124.6" y="167">Tue</text><text class="d-val" x="124.6" y="41.0">81</text><rect class="b-bar" x="187.3" y="80.8" width="30.0" height="71.2" rx="3"><title>Wednesday: 55 min/day avg</title></rect><text class="d-lab" x="202.3" y="167">Wed</text><text class="d-val" x="202.3" y="74.8">55</text><rect class="b-bar" x="265.0" y="89.5" width="30.0" height="62.5" rx="3"><title>Thursday: 48 min/day avg</title></rect><text class="d-lab" x="280.0" y="167">Thu</text><text class="d-val" x="280.0" y="83.5">48</text><rect class="b-bar" x="342.7" y="117.8" width="30.0" height="34.2" rx="3"><title>Friday: 26 min/day avg</title></rect><text class="d-lab" x="357.7" y="167">Fri</text><text class="d-val" x="357.7" y="111.8">26</text><rect class="b-bar" x="420.4" y="126.9" width="30.0" height="25.1" rx="3"><title>Saturday: 19 min/day avg</title></rect><text class="d-lab" x="435.4" y="167">Sat</text><text class="d-val" x="435.4" y="120.9">19</text><rect class="b-bar" x="498.1" y="110.6" width="30.0" height="41.4" rx="3"><title>Sunday: 32 min/day avg</title></rect><text class="d-lab" x="513.1" y="167">Sun</text><text class="d-val" x="513.1" y="104.6">32</text></svg>