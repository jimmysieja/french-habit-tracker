<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 176" width="100%" role="img" aria-label="Average minutes practised by day of week"><style>
.p-title{fill:#e9e9e9;font-size:12px;font-weight:600}
.p-sub{fill:#858585;font-size:10px}
.p-line{fill:none;stroke:#7aa6cf;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.p-area{fill:#7aa6cf;opacity:.10}
.p-end{fill:#7aa6cf;stroke:#1d1f24;stroke-width:2}
.p-endlab{fill:#b2b2b2;font-size:10px;text-anchor:end;font-weight:600}
.p-target{stroke:#858585;stroke-width:1;stroke-dasharray:0}
.p-tlabel{fill:#858585;font-size:9px;text-anchor:end}
.p-base{stroke:#3a3d43;stroke-width:1}
.b-bar{fill:#7aa6cf}
.b-bar:hover{fill:#7aa6cf;opacity:.85}
.b-hi{fill:#7aa6cf}
.d-lab{fill:#858585;font-size:10px;text-anchor:middle}
.d-val{fill:#b2b2b2;font-size:10px;text-anchor:middle;font-weight:600}
/* heatmap */
.hm-mon{fill:#858585;font-size:10px}
.hm-dow{fill:#858585;font-size:9px;text-anchor:end}
rect:hover{opacity:.8}
/* horizontal bars */
.h-cat{fill:#e9e9e9;font-size:12px;text-anchor:end;dominant-baseline:middle}
.h-track{fill:#2b2d33}
.h-fill{fill:#7aa6cf}
.h-val{fill:#b2b2b2;font-size:11px;font-weight:600;dominant-baseline:middle}
.h-obj{stroke:#e9e9e9;stroke-width:2}
.ts-lab{fill:#e9e9e9;font-size:11px;font-weight:600}
.ts-val{fill:#b2b2b2;font-size:11px}
